name: Deploy develop

on:
  pull_request:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Configure Vercel Node.js runtime
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X PATCH "https://api.vercel.com/v9/projects/xaccount-ui?teamId=itering" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"nodeVersion":"26.x"}'

      - uses: darwinia-network/devops/actions/smart-vercel@main
        id: deploy_vercel
        name: Deploy to Vercel
        with:
          node_version: 22
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_group: itering
          script_install: pnpm install
          script_build: pnpm build
          preview_output: true
          dist_path: out
          project_name: xaccount-ui
          alias_domain: "xaccount-dev"
          enable_cache: true
          enable_notify_comment: true
          enable_notify_slack: false
          slack_channel: public-ringdao-apps
          slack_webhook: ${{ secrets.SLACK_INCOMING_WEBHOOK_URL }}

      - name: Slack Notification
        if: ${{ success() }}
        continue-on-error: true
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: public-ringdao-apps
          SLACK_COLOR: ${{ job.status }}
          SLACK_ICON: https://avatars.githubusercontent.com/u/14985020?s=48&v=4
          SLACK_MESSAGE: ${{ steps.deploy_vercel.outputs.PREVIEW_LINK }}
          SLACK_TITLE: Preview
          SLACK_USERNAME: Vercel
          SLACK_WEBHOOK: ${{ secrets.SLACK_INCOMING_WEBHOOK_URL }}
